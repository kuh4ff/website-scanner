<!DOCTYPE html>
<html>

<head>
    <title>NEXUS PRO - DEV AUTH</title>
    <style>
        body {
            background: #050510;
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: #1a1a2e;
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 10px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-family: monospace;
            font-size: 13px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
            font-size: 14px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.loading {
            opacity: 0.7;
            cursor: wait;
            pointer-events: none;
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            display: none;
        }

        .status-box.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-box.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #6366f1;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.05;
            pointer-events: none;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>
    <canvas class="matrix-bg" id="matrix"></canvas>

    <div class="container" id="loginPanel">
        <div class="logo">🔒</div>
        <h1>NEXUS SECURITY GUARD</h1>
        <p>This script is protected. Authentication is required to unlock the source code execution environment.</p>

        <div class="input-group">
            <label>GITHUB PERSONAL ACCESS TOKEN (PAT)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        </div>

        <button id="btnLogin" onclick="authenticate()">AUTHENTICATE WITH GITHUB</button>

        <div id="status" class="status-box"></div>
        <p style="margin-top: 20px; font-size: 11px; color: #64748b;">Only authorized repository owners can proceed.</p>
    </div>

    <div class="container" id="successPanel" style="display: none;">
        <div class="logo">🔓</div>
        <h1>NEXUS UNLOCKED</h1>
        <div class="user-info" id="userInfo"></div>
        <p id="unlockMsg" style="color: #10b981;">Identity Verified. Runtime Guard Disabled.</p>

        <div
            style="background: #0f172a; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #94a3b8; border: 1px solid #334155;">
            <div id="consoleOutput">Loading script...</div>
        </div>

        <button onclick="logout()">LOCK SESSION</button>
    </div>

    <script>
        const OWNER_USERNAME = 'kuh4ff'; // AUTHORIZED USER

        // Matrix Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = '01';
        const drops = Array(Math.floor(canvas.width / 20)).fill(1);
        setInterval(() => {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = '15px monospace';
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * 20, y * 20);
                if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }, 50);

        // Auth Logic
        async function authenticate() {
            const token = document.getElementById('ghToken').value.trim();
            const btn = document.getElementById('btnLogin');
            const status = document.getElementById('status');

            if (!token) return showStatus('Token required', 'error');

            btn.classList.add('loading');
            btn.textContent = 'VERIFYING IDENTITY...';
            status.style.display = 'none';

            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (response.status === 401) throw new Error('Invalid Token');
                if (!response.ok) throw new Error('Connection Failed');

                const user = await response.json();

                if (user.login === OWNER_USERNAME) {
                    // Success
                    localStorage.setItem('nexus_dev_auth', token);
                    showStatus('Identity Verified!', 'success');
                    setTimeout(() => unlockEnvironment(user), 1000);
                } else {
                    throw new Error(`Unauthorized User: ${user.login}`);
                }

            } catch (e) {
                showStatus(e.message, 'error');
                btn.classList.remove('loading');
                btn.textContent = 'AUTHENTICATE WITH GITHUB';
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status-box ' + type;
            el.style.display = 'block';
        }

        function unlockEnvironment(user) {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('successPanel').style.display = 'block';

            document.getElementById('userInfo').innerHTML = `
                <img src="${user.avatar_url}" class="avatar">
                <span style="font-weight: bold; color: white;">@${user.login}</span>
            `;

            // INJECT GUARD TOKEN
            window.__NEXUS_GUARD_TOKEN__ = 'nexus-secure-entry';

            // Load Script
            log('Injecting Security Token...');
            log('Fetching all_phases.js...');

            const script = document.createElement('script');
            script.src = 'all_phases.js';
            script.onload = () => {
                log('✅ Script Loaded Successfully!');
                log('Nexus Version: ' + (window.NexusEnvironment ? 'Active' : 'Unknown'));
            };
            script.onerror = (e) => {
                log('❌ Script Load Error (Check Console)');
            };
            document.body.appendChild(script);
        }

        function log(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            document.getElementById('consoleOutput').appendChild(div);
        }

        function logout() {
            localStorage.removeItem('nexus_dev_auth');
            location.reload();
        }

        // Auto-login check
        window.onload = async () => {
            const savedToken = localStorage.getItem('nexus_dev_auth');
            if (savedToken) {
                document.getElementById('ghToken').value = savedToken;
                authenticate();
            }
        };
    </script>
</body>

</html>
